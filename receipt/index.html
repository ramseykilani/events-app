<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Are you in?</title>
<!--
  Who's Coming receipt page (FEATURES.md → Who's Coming). One capability URL
  per send, texted to recipients who don't have the app. The event card is a
  full mirror of the in-app event detail screen — image, title, when, where,
  full description, and the listing link — plus Yes / No: nothing else, no
  other people, no comments, no install CTA. The two Add to Other Calendars
  links under the event are event content, not promo (FEATURES.md → Add to
  Other Calendars): a Google template link and an in-page .ics download,
  both built client-side from the GET's fields. The page is inert until the
  visitor chooses an answer: state loads over GET (which never writes, so
  SMS/iMessage prefetch can't answer for them) and the write fires only on
  an explicit tap. Last write wins — the same link changes the answer later.

  Affiliate Link Tagging: the GET returns the listing URL pre-tagged when
  the provider's program is live (send-response reads the affiliate
  registry server-side), so this page carries no tagging logic — the
  listing link and the calendar-export bodies simply use the URL they get.
-->
<style>
  :root {
    --background: #faf7f0;
    --surface: #ffffff;
    --surface-secondary: #f1ece0;
    --selected-bg: #f3ecda;
    --text-primary: #1a1815;
    --text-secondary: #6b6357;
    --text-tertiary: #a39a8b;
    --border: #e3dcc9;
    --accent: #c8871e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;
  }
  main {
    width: 100%;
    max-width: 420px;
    align-self: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
  }
  /* The event image leads the card, mirroring the in-app detail screen.
     The [hidden] guard is required: .image's display:block would otherwise
     override the hidden attribute's display:none. */
  .image {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
    margin: 0 0 20px;
  }
  .image[hidden] {
    display: none;
  }
  .asker {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 0 0 8px;
  }
  .title {
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 6px;
  }
  .meta {
    font-size: 16px;
    color: var(--text-secondary);
    margin: 0 0 24px;
  }
  /* Location: the where snugs up under the when (same negative-margin pull
     as .calendar-links), in the accent like the in-app detail row. */
  .location {
    font-size: 16px;
    color: var(--accent);
    margin: -16px 0 24px;
  }
  /* Full description and the listing link: left-aligned body text, like the
     in-app detail screen. The link wears the accent (the app's linkText
     shares the accent's value in every theme). */
  .description {
    font-size: 16px;
    line-height: 1.5;
    text-align: left;
    margin: 0 0 20px;
    white-space: pre-line;
  }
  .listing-link {
    text-align: left;
    margin: 0 0 20px;
  }
  .listing-link a {
    color: var(--accent);
    font-size: 17px;
    text-decoration: underline;
    display: inline-block;
    /* 12px vertical padding puts the tap target at the app's 44pt floor. */
    padding: 12px 0;
  }
  /* Add to Other Calendars: secondary text links under the event details. */
  .calendar-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 14px;
    margin: -12px 0 24px;
  }
  .calendar-links a,
  .calendar-links button {
    color: var(--text-secondary);
    background: none;
    border: none;
    padding: 8px 0;
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  .question {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .answers {
    display: flex;
    gap: 12px;
  }
  .answers button {
    flex: 1;
    min-height: 52px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-secondary);
    color: var(--text-primary);
    cursor: pointer;
    padding: 12px;
  }
  .answers button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    font-weight: 700;
  }
  .answers button:disabled { opacity: 0.6; cursor: default; }
  /* Pending: the tapped button shows a spinner in its label's own ink — the
     visible working phase that makes the confirmed fill trustworthy. */
  .answers button.pending { font-size: 0; }
  .answers button.pending::after {
    content: '';
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* The confirmation re-asserts on every save (a re-tap re-runs the fade). */
  .hint.flash { animation: hint-in 0.25s ease-out; }
  @keyframes hint-in { from { opacity: 0; } to { opacity: 1; } }
  .hint {
    font-size: 13px;
    color: var(--text-tertiary);
    line-height: 1.5;
    margin: 20px 0 0;
  }
  .status {
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin: 0;
  }
  .error .status { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <p class="status" id="status">Loading…</p>
    <div id="content" hidden>
      <img class="image" id="image" alt="" hidden />
      <p class="asker" id="asker"></p>
      <h1 class="title" id="title"></h1>
      <p class="meta" id="meta"></p>
      <p class="location" id="location" hidden></p>
      <p class="description" id="description" hidden></p>
      <p class="listing-link" id="listing-link" hidden>
        <a id="listing-url" href="#" target="_blank" rel="noopener">Open link</a>
      </p>
      <div class="calendar-links">
        <a id="cal-google" href="#" target="_blank" rel="noopener">Add to Google Calendar</a>
        <button type="button" id="cal-ics">Apple / Outlook / Other (.ics)</button>
      </div>
      <p class="question">Are you in?</p>
      <div class="answers">
        <button type="button" id="yes" aria-pressed="false">Yes</button>
        <button type="button" id="no" aria-pressed="false">No</button>
      </div>
      <p class="hint" id="hint" role="status"></p>
    </div>
  </div>
</main>
<script>
(function () {
  // The edge function is the API; this static page is only the shell. The
  // function URL never appears in a text message — the SMS carries this
  // page's short host with the per-send token. (The project URL is a public
  // identifier baked into every client bundle, not a secret.)
  var API_URL = 'https://ijmwtjyuvdnvhblwwtpt.supabase.co/functions/v1/send-response'; // pragma: allowlist secret

  var token = new URLSearchParams(window.location.search).get('t');
  var statusEl = document.getElementById('status');
  var contentEl = document.getElementById('content');
  var askerEl = document.getElementById('asker');
  var titleEl = document.getElementById('title');
  var metaEl = document.getElementById('meta');
  var locationEl = document.getElementById('location');
  var imageEl = document.getElementById('image');
  var descriptionEl = document.getElementById('description');
  var listingLinkEl = document.getElementById('listing-link');
  var listingUrlEl = document.getElementById('listing-url');
  var hintEl = document.getElementById('hint');
  var yesBtn = document.getElementById('yes');
  var noBtn = document.getElementById('no');
  var googleLink = document.getElementById('cal-google');
  var icsBtn = document.getElementById('cal-ics');
  var current = null;
  var currentState = null;
  var askerName = '';
  var saving = false;
  var savedThisVisit = false;

  // --- Add to Other Calendars: inline port of lib/calendarLinks.ts (this
  // static page has no build step and cannot import it). One-shot snapshot
  // export: timed → a floating 1-hour block, no time → all-day, free-text
  // location → the location field, full description + listing url in the
  // body. The .ics UID derives from the
  // send's token (the GET deliberately exposes no event id), so re-adding
  // from this same link updates rather than duplicates in UID-deduping apps.
  // e2e/receipt.spec.ts pins this port against the app's Jest-pinned builders.
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(y, m, d) { return '' + y + pad2(m) + pad2(d); }
  function ymdHms(y, m, d, h, min) { return ymd(y, m, d) + 'T' + pad2(h) + pad2(min) + '00'; }

  function eventDetails(state) {
    return [state.description, state.url].filter(Boolean).join('\n\n');
  }

  function buildGoogleUrl(state) {
    var parts = state.date.split('-').map(Number);
    var y = parts[0], m = parts[1], d = parts[2];
    var dates;
    if (state.time) {
      var tp = state.time.split(':').map(Number);
      var end = new Date(y, m - 1, d, tp[0] + 1, tp[1]);
      dates = ymdHms(y, m, d, tp[0], tp[1]) + '/' +
        ymdHms(end.getFullYear(), end.getMonth() + 1, end.getDate(), end.getHours(), end.getMinutes());
    } else {
      var next = new Date(y, m - 1, d + 1);
      dates = ymd(y, m, d) + '/' + ymd(next.getFullYear(), next.getMonth() + 1, next.getDate());
    }
    var url = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' +
      encodeURIComponent(state.title == null ? 'Untitled event' : state.title) + '&dates=' + dates;
    var details = eventDetails(state);
    if (details) url += '&details=' + encodeURIComponent(details);
    if (state.location) url += '&location=' + encodeURIComponent(state.location);
    return url;
  }

  function escapeIcsText(text) {
    return text.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
      .replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\n/g, '\\n');
  }

  function utf8Bytes(ch) {
    var cp = ch.codePointAt(0) || 0;
    return cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
  }

  // RFC 5545 §3.1: 75-octet lines, folded with CRLF + one space, never
  // splitting a multi-byte character.
  function foldLine(line) {
    var chunks = [];
    var current = '';
    var currentBytes = 0;
    var limit = 75;
    for (var ch of line) {
      var bytes = utf8Bytes(ch);
      if (currentBytes + bytes > limit) {
        chunks.push(current);
        current = '';
        currentBytes = 0;
        limit = 74;
      }
      current += ch;
      currentBytes += bytes;
    }
    chunks.push(current);
    return chunks.join('\r\n ');
  }

  function buildIcs(state) {
    var parts = state.date.split('-').map(Number);
    var y = parts[0], m = parts[1], d = parts[2];
    var startLine, endLine;
    if (state.time) {
      var tp = state.time.split(':').map(Number);
      var end = new Date(y, m - 1, d, tp[0] + 1, tp[1]);
      startLine = 'DTSTART:' + ymdHms(y, m, d, tp[0], tp[1]);
      endLine = 'DTEND:' +
        ymdHms(end.getFullYear(), end.getMonth() + 1, end.getDate(), end.getHours(), end.getMinutes());
    } else {
      var next = new Date(y, m - 1, d + 1);
      startLine = 'DTSTART;VALUE=DATE:' + ymd(y, m, d);
      endLine = 'DTEND;VALUE=DATE:' + ymd(next.getFullYear(), next.getMonth() + 1, next.getDate());
    }
    var details = eventDetails(state);
    var lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//shared-events//events-app//EN',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:' + token + '@shared-events',
      'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''),
      startLine,
      endLine,
      'SUMMARY:' + escapeIcsText(state.title == null ? 'Untitled event' : state.title)
    ];
    if (details) lines.push('DESCRIPTION:' + escapeIcsText(details));
    if (state.location) lines.push('LOCATION:' + escapeIcsText(state.location));
    lines.push('END:VEVENT', 'END:VCALENDAR');
    return lines.map(foldLine).join('\r\n') + '\r\n';
  }

  function slug(title) {
    return (title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  icsBtn.addEventListener('click', function () {
    if (!currentState) return;
    var blob = new Blob([buildIcs(currentState)], { type: 'text/calendar' });
    var objectUrl = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = objectUrl;
    a.download = (slug(currentState.title) || 'event') + '.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objectUrl);
  });

  function formatDate(dateStr) {
    var parts = dateStr.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric'
    });
  }

  function formatTime(timeStr) {
    return new Date('1970-01-01T' + timeStr).toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit'
    });
  }

  function showError(message) {
    statusEl.textContent = message;
    statusEl.parentElement.classList.add('error');
    statusEl.hidden = false;
    contentEl.hidden = true;
  }

  function renderHint() {
    // One standing hint; the "Saved." prefix appears only after a successful
    // write this visit and stays until reload. A fresh load shows state (the
    // pressed button) with no event prose — nothing here auto-dismisses.
    hintEl.textContent =
      (savedThisVisit ? 'Saved. ' : '') +
      'You can change your answer anytime with this link.';
  }

  function render(state) {
    current = state.response;
    currentState = state;
    askerName = state.askerName;
    askerEl.textContent = askerName + ' asked';
    titleEl.textContent = state.title || 'an event';
    metaEl.textContent = formatDate(state.date) + (state.time ? ' · ' + formatTime(state.time) : '');
    if (state.location) {
      locationEl.textContent = state.location;
      locationEl.hidden = false;
    } else {
      locationEl.hidden = true;
    }
    // The detail-screen mirror: image, full description, and the listing
    // link. state.url arrives pre-tagged when the provider's affiliate
    // program is live (send-response tags server-side); the calendar-export
    // bodies below use the same URL, by owner decision (2026-09-02).
    if (state.image_url) {
      imageEl.src = state.image_url;
      imageEl.alt = state.title ? state.title + ' image' : 'Event image';
      imageEl.hidden = false;
    } else {
      imageEl.hidden = true;
    }
    imageEl.onerror = function () {
      imageEl.hidden = true;
    };
    if (state.description) {
      descriptionEl.textContent = state.description;
      descriptionEl.hidden = false;
    } else {
      descriptionEl.hidden = true;
    }
    // http(s) only: the URL is sharer-controlled, so a javascript: link
    // never becomes clickable here.
    if (state.url && /^https?:\/\//i.test(state.url)) {
      listingUrlEl.href = state.url;
      listingLinkEl.hidden = false;
    } else {
      listingLinkEl.hidden = true;
    }
    googleLink.href = buildGoogleUrl(state);
    yesBtn.setAttribute('aria-pressed', String(current === 'yes'));
    noBtn.setAttribute('aria-pressed', String(current === 'no'));
    renderHint();
    statusEl.hidden = true;
    contentEl.hidden = false;
  }

  function answer(response) {
    // Re-tapping the selected answer round-trips on purpose: the server
    // no-ops it (changed=false, the asker is never re-pinged) and the
    // re-asserted "Saved." keeps the reassurance probe truthful.
    if (saving) return;
    saving = true;
    var tappedBtn = response === 'yes' ? yesBtn : noBtn;
    yesBtn.disabled = true;
    noBtn.disabled = true;
    tappedBtn.classList.add('pending');
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: token, response: response })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('save failed: ' + res.status);
        return res.json();
      })
      .then(function (out) {
        current = out.response;
        savedThisVisit = true;
        yesBtn.setAttribute('aria-pressed', String(current === 'yes'));
        noBtn.setAttribute('aria-pressed', String(current === 'no'));
        renderHint();
        hintEl.classList.remove('flash');
        void hintEl.offsetWidth; // restart the fade so a re-tap re-asserts
        hintEl.classList.add('flash');
      })
      .catch(function () {
        hintEl.textContent = "That didn't save. Check your connection and try again.";
      })
      .finally(function () {
        saving = false;
        tappedBtn.classList.remove('pending');
        yesBtn.disabled = false;
        noBtn.disabled = false;
      });
  }

  yesBtn.addEventListener('click', function () { answer('yes'); });
  noBtn.addEventListener('click', function () { answer('no'); });

  if (!token) {
    showError("This link doesn't work — it has no response code.");
    return;
  }

  // Inert read: loading state never records an answer.
  fetch(API_URL + '?t=' + encodeURIComponent(token))
    .then(function (res) {
      if (res.status === 404) throw new Error('gone');
      if (!res.ok) throw new Error('load failed: ' + res.status);
      return res.json();
    })
    .then(render)
    .catch(function (err) {
      showError(
        err && err.message === 'gone'
          ? "This link doesn't work anymore — the event may have been removed."
          : "Couldn't load. Check your connection and reopen the link."
      );
    });
})();
</script>
</body>
</html>
