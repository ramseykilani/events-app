# Agentic UX review of the staging preview — the release-candidate review.
#
# Deliberately NOT run on every staging push: reviews are batched and happen
# at ship time, covering every feature, before anything promotes to
# production. The normal path is the ship-it protocol in AGENTS.md (the agent
# runs the review in-session via a computerUse subagent, no GitHub secrets
# needed). This workflow is the optional hands-off path: it fires on release
# PRs (staging → production) and on manual dispatch.
#
# Setup (one time): add the repo secret CURSOR_API_KEY (Cursor Dashboard →
# API Keys). Until then the workflow exits quietly. Cursor-side, the repo's
# Cloud Agent secrets (EXPO_PUBLIC_SUPABASE_*) come from the Cursor dashboard,
# same as for any cloud agent.
name: Agent UX review
on:
  pull_request:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: agent-ux-review
  cancel-in-progress: false

jobs:
  launch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # Repo variable UX_REVIEW_MODEL overrides the review agent's model.
      # Screenshot-driven review doesn't need the top coding model;
      # cursor-grok-4.5-high-fast is the cost-effective default. Discover
      # valid IDs via GET https://api.cursor.com/v1/models with the API key.
      UX_REVIEW_MODEL: ${{ vars.UX_REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Launch Cursor cloud agent
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY secret not set — skipping agent UX review."
            echo "Set it (Cursor Dashboard → API Keys) to enable; see docs/development-workflow.md."
            exit 0
          fi
          MODEL_ID="${UX_REVIEW_MODEL:-cursor-grok-4.5-high-fast}"
          build_payload() {
            jq -n \
              --arg prompt "$(cat scripts/agent-ux-review-prompt.md)" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}" \
              --arg model "$1" \
              '{
                prompt: { text: $prompt },
                repos: [{ url: $url, startingRef: "staging" }],
                autoCreatePR: true
              } + (if $model == "" then {} else { model: { id: $model } } end)'
          }
          RESPONSE=$(build_payload "${MODEL_ID}" | curl -sf --request POST \
            --url https://api.cursor.com/v1/agents \
            -u "${CURSOR_API_KEY}:" \
            --header 'Content-Type: application/json' \
            --data @-) || {
              echo "::warning::Launch with model '${MODEL_ID}' failed — retrying with the account default model."
              RESPONSE=$(build_payload "" | curl -sf --request POST \
                --url https://api.cursor.com/v1/agents \
                -u "${CURSOR_API_KEY}:" \
                --header 'Content-Type: application/json' \
                --data @-)
            }
          AGENT_URL=$(echo "${RESPONSE}" | jq -r '.agent.url')
          echo "UX review agent launched: ${AGENT_URL}"
          echo "### UX review agent launched: ${AGENT_URL}" >> "${GITHUB_STEP_SUMMARY}"
