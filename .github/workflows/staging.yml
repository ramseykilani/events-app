# Staging integration pipeline.
#
# Every push to `staging` runs the full suite (static checks + SQL + Jest +
# desktop/mobile-web e2e). Only when it is green does the staging preview
# redeploy to https://staging.shared-events.pages.dev (Cloudflare Pages
# branch alias for --branch=staging), so the preview always reflects the
# latest known-good staging.
#
# Requires the same repo Variable/Secrets as deploy-web.yml.
name: Staging
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  # Superseded queued pushes each burned a full ~15-min run; the latest tip
  # covers everything (staging is cumulative), so cancel them.
  group: staging-pipeline
  cancel-in-progress: true

jobs:
  full-suite:
    uses: ./.github/workflows/full-suite.yml
    secrets: inherit

  deploy-preview:
    name: Deploy staging preview
    needs: full-suite
    # Vars gate keeps the workflow inert until Cloudflare secrets are configured.
    if: vars.DEPLOY_WEB == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deploy the exact bundle the e2e job just tested.
      - name: Download tested bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # No npm ci: installing the whole tree (measured 55–425s) only put
      # wrangler in node_modules for a 4s deploy. npx fetches just wrangler,
      # pinned to the version in package.json.
      - name: Deploy preview to Cloudflare Pages (branch alias "staging")
        run: npx --yes wrangler@4.120.0 pages deploy --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
