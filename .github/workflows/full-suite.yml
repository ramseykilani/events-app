# Full test suite — reusable workflow (workflow_call) invoked by:
#   - staging.yml  on every push to staging (before the preview deploy)
#   - release.yml  on every staging→production PR (the release gate)
#
# Layers: static checks (tsc, Jest, SQL semantics) → web build → Playwright
# e2e against the built bundle on desktop Chrome, Mobile Safari (WebKit), and
# Mobile Chrome. The e2e suite signs in with the Supabase test-OTP accounts
# documented in AGENTS.md, so it needs EXPO_PUBLIC_SUPABASE_URL /
# EXPO_PUBLIC_SUPABASE_ANON_KEY secrets to build the bundle.
name: Full suite
on:
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Convention checks
        run: npm run test:conventions

      - name: Jest suite
        run: npm test -- --runInBand --ci

      - name: Set up PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          sudo systemctl start postgresql || sudo service postgresql start
          sudo -u postgres psql -c 'SELECT 1'

      - name: SQL semantics suite
        run: bash supabase/tests/run_local.sh

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The e2e suite signs in against the real Supabase project, so it needs
      # the EXPO_PUBLIC_* repo secrets. Until they're configured, skip the
      # browser steps with a warning instead of failing red — the fast checks
      # in the sibling job still gate the branch.
      - name: Check for Supabase secrets
        id: secrets
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY repo secrets not set — e2e steps skipped. Add them to make the full-suite gate binding."
          fi

      # EXPO_PUBLIC_* values are inlined into the bundle at export time.
      - name: Build web bundle
        if: steps.secrets.outputs.present == 'true'
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Cache Playwright browsers
        if: steps.secrets.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.secrets.outputs.present == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright e2e (desktop + mobile web)
        if: steps.secrets.outputs.present == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Optional: enables SMS-free password sign-in in the auth setup.
          # Absent → the setup falls back to the OTP UI (one rejected Twilio
          # send attempt per account per run).
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
        run: npm run test:e2e

      - name: Upload built bundle (reused by the staging preview deploy)
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
