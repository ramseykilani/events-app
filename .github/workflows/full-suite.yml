# Full test suite — reusable workflow (workflow_call) invoked by:
#   - staging.yml  on every push to staging (before the preview deploy)
#   - release.yml  on every staging→production PR (the release gate)
#
# Layers: static checks (tsc, Jest, SQL semantics) run in PARALLEL with the
# browser matrix — the repo is public, so runner-minutes are free and a red
# static check still signals at minute ~3. The e2e-browsers matrix runs each
# Playwright project (desktop Chrome, Mobile Safari/WebKit, Mobile Chrome) as
# its own leg, each with its OWN standing test-account pair via E2E_PHONE_A/B
# (e2e/helpers.ts reads the overrides), so parallel legs never race each
# other's calendars. The no-op `e2e` aggregator job preserves the required
# status check name `full-suite / e2e` on production.
name: Full suite
on:
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Convention checks
        run: npm run test:conventions

      - name: Jest suite
        run: npm test -- --runInBand --ci

      - name: Set up PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          sudo systemctl start postgresql || sudo service postgresql start
          sudo -u postgres psql -c 'SELECT 1'

      - name: SQL semantics suite
        run: bash supabase/tests/run_local.sh

  e2e-browsers:
    strategy:
      # One leg's failure must not cancel the others — the surviving legs'
      # results are the useful signal.
      fail-fast: false
      matrix:
        include:
          # Standing pairs documented in AGENTS.md → Signing in. Each leg
          # owns its pair; never point two legs at the same accounts.
          - project: desktop-chrome
            phone_a: '+15555550100'
            phone_b: '+15555550103'
          - project: mobile-safari
            phone_a: '+15555550110'
            phone_b: '+15555550111'
          - project: mobile-chrome
            phone_a: '+15555550112'
            phone_b: '+15555550113'
    runs-on: ubuntu-latest
    # Browsers + OS deps come preinstalled in the image, so there is no
    # playwright install step and no apt flakiness. The tag MUST match the
    # @playwright/test version in package-lock.json — bump both together.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      E2E_PHONE_A: ${{ matrix.phone_a }}
      E2E_PHONE_B: ${{ matrix.phone_b }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The e2e suite signs in against the real Supabase project, so it needs
      # the EXPO_PUBLIC_* repo secrets. Until they're configured, skip the
      # browser steps with a warning instead of failing red — the fast checks
      # in the sibling job still gate the branch.
      - name: Check for Supabase secrets
        id: secrets
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY repo secrets not set — e2e steps skipped. Add them to make the full-suite gate binding."
          fi

      # EXPO_PUBLIC_* values are inlined into the bundle at export time.
      - name: Build web bundle
        if: steps.secrets.outputs.present == 'true'
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # The `setup` project (auth.setup.ts) runs automatically as a declared
      # dependency of each browser project and signs in this leg's pair once.
      - name: Playwright e2e (${{ matrix.project }})
        if: steps.secrets.outputs.present == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Optional: enables SMS-free password sign-in in the auth setup.
          # Absent → the setup falls back to the OTP UI (one rejected Twilio
          # send attempt per account per run).
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
        run: npx playwright test --project=${{ matrix.project }}

      # Only one leg may upload the `dist` artifact (names are run-global);
      # the staging preview deploy downloads it. All legs build the identical
      # bundle from the same commit and secrets.
      - name: Upload built bundle (reused by the staging preview deploy)
        if: steps.secrets.outputs.present == 'true' && matrix.project == 'desktop-chrome'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Aggregator: branch protection on production requires the check
  # `full-suite / e2e`, but a matrix renames its checks to
  # `full-suite / e2e-browsers (<project>)`. This job keeps the old name
  # binding with no settings change. `if: always()` + an explicit result
  # check matters: a job skipped because its `needs` failed would otherwise
  # report SUCCESS to branch protection.
  e2e:
    needs: e2e-browsers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate browser legs
        run: |
          result="${{ needs.e2e-browsers.result }}"
          echo "e2e-browsers: $result"
          [ "$result" = "success" ]
