# Deploys the static web build to Cloudflare Pages via Wrangler.
#
# Disabled by default. To enable, in the GitHub repo set:
#   - Variable  DEPLOY_WEB = "true"                 (Settings > Secrets and variables > Actions > Variables)
#   - Secrets   CLOUDFLARE_API_TOKEN                (Cloudflare Pages: Edit)
#               CLOUDFLARE_ACCOUNT_ID
#               EXPO_PUBLIC_SUPABASE_URL
#               EXPO_PUBLIC_SUPABASE_ANON_KEY
# The Pages project must exist first (see AGENTS.md → Deploying the web app).
name: Deploy web
on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    # Vars gate keeps the workflow inert until Cloudflare secrets are configured.
    if: vars.DEPLOY_WEB == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 22
          cache: npm

      # Same node_modules cache as full-suite.yml (shared key — see the
      # comment there). A hit skips npm ci entirely; the wrangler invocation
      # below then also resolves from the restored tree without a registry
      # fetch.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (npm ci on cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # EXPO_PUBLIC_* values are inlined into the bundle at export time.
      - name: Build web bundle
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
