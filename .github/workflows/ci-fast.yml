# Fast checks for PRs into staging.
#
# Agents push finished work straight to `staging` (after running these same
# checks locally — see AGENTS.md), so PRs into staging are optional paper
# trail; when one is opened, this is its gate. The full suite (including
# mobile-web e2e) runs on every push to staging and again as the gate on
# staging→production releases — see full-suite.yml, staging.yml,
# release.yml, and docs/development-workflow.md.
name: PR checks (fast)
on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 22
          cache: npm

      # Same node_modules cache as full-suite.yml (shared key — see the
      # comment there). A hit skips npm ci entirely; no restore-keys, so a
      # stale tree can never slip past a lockfile change.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (npm ci on cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Convention checks
        run: npm run test:conventions

      - name: Jest suite
        run: npm test -- --runInBand --ci

      - name: Set up PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          sudo systemctl start postgresql || sudo service postgresql start
          sudo -u postgres psql -c 'SELECT 1'

      - name: SQL semantics suite
        run: bash supabase/tests/run_local.sh
